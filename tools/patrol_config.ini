# ==============================================================================
# 什么什么大冒险2.0 - 纯净巡逻控制配置文件 (patrol_config.ini)
# ==============================================================================
# Enabled: 巡逻主开关 (true: 开启, false: 停止)
Enabled = false

# LeaderName: 负责带队巡逻的队长角色名 (只有队长客户端执行寻路走动，队员安心跟随)
LeaderName = 伏地魔1

# Mode: 巡逻模式 ("AutoAnchor" 就地智能定点 / "Custom" 自定义两点坐标)
Mode = AutoAnchor

# Command: 即时指令 (START / STOP / ANCHOR / CUSTOM / 空)
Command = 

# AutoAnchorRadius: 智能就地定点时的往返步长半径 (像素，默认 160)
AutoAnchorRadius = 160

# 巡逻两点坐标 (若 PointAX 与 PointBX 为 0，开启时将自动抓取当前站位智能定点)
PointAX = 0
PointAY = 0
PointBX = 0
PointBY = 0
